<!DOCTYPE html>
<html lang="pl" data-theme="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Korona Gór Polski</title>

  <!-- Leaflet -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css" />
  <script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>

  <!-- Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600;700&family=Crimson+Pro:ital,wght@0,300;0,400;1,300;1,400&display=swap" rel="stylesheet" />

  <style>
    /* ─── CSS Variables ─────────────────────────────────────────── */
    :root {
      --transition: 0.35s cubic-bezier(.4,0,.2,1);
    }

    [data-theme="dark"] {
      --bg:          #0d1117;
      --bg2:         #161b22;
      --bg3:         #21262d;
      --border:      #30363d;
      --text:        #e6edf3;
      --text-muted:  #8b949e;
      --accent:      #d4a853;
      --accent2:     #c8864e;
      --peak-pin:    #d4a853;
      --peak-ring:   rgba(212,168,83,.25);
      --nav-bg:      rgba(13,17,23,.92);
      --popup-bg:    #161b22;
      --shadow:      0 8px 32px rgba(0,0,0,.6);
      --map-filter:  brightness(.85) saturate(.7) hue-rotate(190deg);
    }

    [data-theme="light"] {
      --bg:          #f5f0e8;
      --bg2:         #fffdf7;
      --bg3:         #ede8dc;
      --border:      #d4c9b0;
      --text:        #2c2416;
      --text-muted:  #7a6e5f;
      --accent:      #8b4513;
      --accent2:     #c8722a;
      --peak-pin:    #8b4513;
      --peak-ring:   rgba(139,69,19,.2);
      --nav-bg:      rgba(245,240,232,.95);
      --popup-bg:    #fffdf7;
      --shadow:      0 8px 32px rgba(44,36,22,.18);
      --map-filter:  brightness(1.02) saturate(.85);
    }

    /* ─── Reset & Base ──────────────────────────────────────────── */
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Crimson Pro', Georgia, serif;
      background: var(--bg);
      color: var(--text);
      height: 100dvh;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      transition: background var(--transition), color var(--transition);
    }

    /* ─── Navbar ────────────────────────────────────────────────── */
    nav {
      position: fixed;
      top: 0; left: 0; right: 0;
      z-index: 1000;
      height: 58px;
      background: var(--nav-bg);
      backdrop-filter: blur(12px);
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      padding: 0 24px;
      gap: 16px;
      transition: background var(--transition), border-color var(--transition);
    }

    .nav-logo {
      font-family: 'Cinzel', serif;
      font-size: 1.15rem;
      font-weight: 700;
      letter-spacing: .06em;
      color: var(--accent);
      text-decoration: none;
      white-space: nowrap;
      transition: color var(--transition);
    }

    .nav-logo span {
      color: var(--text);
      font-weight: 400;
      font-size: .95rem;
      letter-spacing: .04em;
    }

    .nav-spacer { flex: 1; }

    .peak-count {
      font-size: .8rem;
      color: var(--text-muted);
      letter-spacing: .06em;
      text-transform: uppercase;
      transition: color var(--transition);
    }

    /* Theme toggle */
    .theme-btn {
      width: 40px; height: 40px;
      border-radius: 50%;
      border: 1px solid var(--border);
      background: var(--bg3);
      color: var(--text);
      cursor: pointer;
      display: flex; align-items: center; justify-content: center;
      font-size: 1.1rem;
      transition: background var(--transition), border-color var(--transition), transform .2s;
    }
    .theme-btn:hover { transform: rotate(20deg) scale(1.08); }

    /* Auth button */
    .auth-btn {
      display: flex; align-items: center; gap: 8px;
      padding: 7px 16px;
      border-radius: 6px;
      border: 1px solid var(--border);
      background: var(--bg3);
      color: var(--text);
      font-family: 'Crimson Pro', serif;
      font-size: .95rem;
      cursor: pointer;
      transition: background var(--transition), border-color var(--transition), transform .15s;
      white-space: nowrap;
    }
    .auth-btn:hover { background: var(--bg2); transform: translateY(-1px); }
    .auth-btn svg { width: 16px; height: 16px; flex-shrink: 0; }

    /* User avatar */
    .user-chip {
      display: flex; align-items: center; gap: 8px;
      padding: 4px 12px 4px 4px;
      border-radius: 30px;
      border: 1px solid var(--border);
      background: var(--bg3);
      cursor: pointer;
      transition: background var(--transition);
    }
    .user-chip:hover { background: var(--bg2); }
    .user-avatar {
      width: 30px; height: 30px;
      border-radius: 50%;
      background: var(--accent);
      display: flex; align-items: center; justify-content: center;
      font-size: .85rem;
      font-weight: 600;
      color: var(--bg);
      overflow: hidden;
    }
    .user-avatar img { width: 100%; height: 100%; object-fit: cover; }
    .user-name { font-size: .9rem; color: var(--text); }

    /* ─── Map ───────────────────────────────────────────────────── */
    #map {
      flex: 1;
      margin-top: 58px;
      filter: var(--map-filter);
      transition: filter var(--transition);
    }

    /* ─── Leaflet popup custom ──────────────────────────────────── */
    .leaflet-popup-content-wrapper {
      background: var(--popup-bg) !important;
      border: 1px solid var(--border) !important;
      border-radius: 12px !important;
      box-shadow: var(--shadow) !important;
      padding: 0 !important;
      overflow: hidden;
      min-width: 280px;
      max-width: 320px;
      transition: background var(--transition);
    }
    .leaflet-popup-tip-container { display: none; }
    .leaflet-popup-content { margin: 0 !important; width: 100% !important; }
    .leaflet-popup-close-button {
      top: 8px !important; right: 10px !important;
      color: var(--text-muted) !important;
      font-size: 1.4rem !important;
      z-index: 10;
    }

    /* Peak popup content */
    .peak-popup {}
    .peak-popup-img {
      width: 100%;
      height: 160px;
      object-fit: cover;
      display: block;
      background: var(--bg3);
    }
    .peak-popup-img-placeholder {
      width: 100%;
      height: 160px;
      background: linear-gradient(135deg, var(--bg3), var(--bg2));
      display: flex;
      align-items: center;
      justify-content: center;
      flex-direction: column;
      gap: 6px;
      color: var(--text-muted);
      font-size: .8rem;
      letter-spacing: .06em;
    }
    .peak-popup-img-placeholder .mountain-icon {
      font-size: 2.5rem;
      opacity: .4;
    }
    .peak-popup-body { padding: 16px 18px 18px; }
    .peak-popup-rank {
      font-size: .7rem;
      font-family: 'Cinzel', serif;
      letter-spacing: .12em;
      color: var(--accent);
      text-transform: uppercase;
      margin-bottom: 4px;
    }
    .peak-popup-name {
      font-family: 'Cinzel', serif;
      font-size: 1.15rem;
      font-weight: 600;
      color: var(--text);
      margin-bottom: 2px;
      line-height: 1.25;
    }
    .peak-popup-height {
      font-size: 1.5rem;
      font-weight: 300;
      font-style: italic;
      color: var(--accent);
      margin-bottom: 12px;
      line-height: 1;
    }
    .peak-popup-height span { font-size: .85rem; font-style: normal; color: var(--text-muted); }
    .peak-popup-meta {
      display: flex;
      flex-direction: column;
      gap: 5px;
      margin-bottom: 12px;
    }
    .peak-popup-meta-row {
      display: flex; align-items: flex-start; gap: 8px;
      font-size: .88rem;
      color: var(--text-muted);
    }
    .peak-popup-meta-row strong { color: var(--text); min-width: 90px; font-weight: 400; }
    .peak-popup-desc {
      font-size: .9rem;
      color: var(--text-muted);
      line-height: 1.55;
      font-style: italic;
      border-top: 1px solid var(--border);
      padding-top: 10px;
    }

    /* ─── Custom map marker ─────────────────────────────────────── */
    .peak-marker {
      width: 28px; height: 28px;
      position: relative;
    }
    .peak-marker-dot {
      width: 12px; height: 12px;
      background: var(--peak-pin);
      border-radius: 50%;
      border: 2.5px solid var(--bg);
      position: absolute;
      top: 50%; left: 50%;
      transform: translate(-50%, -50%);
      box-shadow: 0 0 0 4px var(--peak-ring);
      transition: transform .2s;
    }
    .peak-marker:hover .peak-marker-dot { transform: translate(-50%, -50%) scale(1.3); }

    /* ─── Auth Modal ─────────────────────────────────────────────── */
    .modal-overlay {
      position: fixed; inset: 0;
      background: rgba(0,0,0,.65);
      backdrop-filter: blur(4px);
      z-index: 2000;
      display: flex; align-items: center; justify-content: center;
      opacity: 0; pointer-events: none;
      transition: opacity var(--transition);
    }
    .modal-overlay.open { opacity: 1; pointer-events: all; }

    .modal {
      background: var(--bg2);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 40px 36px;
      width: 360px;
      max-width: 90vw;
      box-shadow: var(--shadow);
      transform: translateY(20px) scale(.97);
      transition: transform var(--transition), background var(--transition);
    }
    .modal-overlay.open .modal { transform: translateY(0) scale(1); }

    .modal-logo {
      text-align: center;
      margin-bottom: 8px;
      font-size: 2.2rem;
    }
    .modal-title {
      font-family: 'Cinzel', serif;
      font-size: 1.3rem;
      font-weight: 600;
      text-align: center;
      color: var(--text);
      margin-bottom: 6px;
    }
    .modal-subtitle {
      font-size: .9rem;
      color: var(--text-muted);
      text-align: center;
      margin-bottom: 28px;
      line-height: 1.5;
    }

    .oauth-btn {
      width: 100%;
      display: flex; align-items: center; justify-content: center; gap: 12px;
      padding: 12px;
      border-radius: 8px;
      border: 1px solid var(--border);
      background: var(--bg3);
      color: var(--text);
      font-family: 'Crimson Pro', serif;
      font-size: 1rem;
      cursor: pointer;
      margin-bottom: 10px;
      transition: background .2s, transform .15s, box-shadow .15s;
    }
    .oauth-btn:hover {
      background: var(--bg);
      transform: translateY(-2px);
      box-shadow: 0 4px 16px rgba(0,0,0,.2);
    }
    .oauth-btn svg { width: 20px; height: 20px; flex-shrink: 0; }
    .oauth-btn-google { }
    .oauth-btn-facebook { }

    .modal-divider {
      display: flex; align-items: center; gap: 12px;
      margin: 16px 0;
      color: var(--text-muted);
      font-size: .8rem;
    }
    .modal-divider::before, .modal-divider::after {
      content: ''; flex: 1;
      height: 1px; background: var(--border);
    }

    .modal-close {
      position: absolute;
      top: 14px; right: 18px;
      background: none; border: none;
      color: var(--text-muted);
      font-size: 1.4rem;
      cursor: pointer;
      padding: 4px;
      line-height: 1;
    }
    .modal-close:hover { color: var(--text); }
    .modal { position: relative; }

    .modal-note {
      font-size: .78rem;
      color: var(--text-muted);
      text-align: center;
      margin-top: 16px;
      line-height: 1.5;
    }

    /* ─── Toast ──────────────────────────────────────────────────── */
    .toast {
      position: fixed;
      bottom: 24px; left: 50%;
      transform: translateX(-50%) translateY(20px);
      background: var(--bg3);
      border: 1px solid var(--border);
      color: var(--text);
      padding: 10px 22px;
      border-radius: 30px;
      font-size: .9rem;
      z-index: 3000;
      opacity: 0;
      pointer-events: none;
      transition: opacity .3s, transform .3s;
    }
    .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

    /* ─── Leaflet overrides ──────────────────────────────────────── */
    .leaflet-control-zoom a {
      background: var(--bg2) !important;
      color: var(--text) !important;
      border-color: var(--border) !important;
    }
    .leaflet-control-zoom a:hover { background: var(--bg3) !important; }
    .leaflet-control-attribution {
      background: var(--nav-bg) !important;
      color: var(--text-muted) !important;
    }
    .leaflet-control-attribution a { color: var(--accent) !important; }
  </style>
</head>

/* ═══════════════════════════════════════════════════════════════
   STAN GLOBALNY
═══════════════════════════════════════════════════════════════ */
let isDark = true;
let tileLayer = null;
const markers = [];

/* ═══════════════════════════════════════════════════════════════
   TOAST
═══════════════════════════════════════════════════════════════ */
let toastTimer;
function showToast(msg, duration = 3000) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => t.classList.remove('show'), duration);
}

/* ═══════════════════════════════════════════════════════════════
   MARKERY
═══════════════════════════════════════════════════════════════ */
function createMarkerIcon() {
  const color  = isDark ? '#d4a853' : '#8b4513';
  const ring   = isDark ? '#d4a85355' : '#8b451344';
  const border = isDark ? '#0d1117'   : '#f5f0e8';
  return L.divIcon({
    html: `<div style="
      width:14px;height:14px;
      background:${color};
      border:3px solid ${border};
      border-radius:50%;
      box-shadow:0 0 0 5px ${ring};
      position:absolute;
      top:50%;left:50%;
      transform:translate(-50%,-50%);
    "></div>`,
    className: '',
    iconSize: [28, 28],
    iconAnchor: [14, 14],
    popupAnchor: [0, -16],
  });
}

function refreshMarkerIcons() {
  markers.forEach(({ marker }) => marker.setIcon(createMarkerIcon()));
}

/* ═══════════════════════════════════════════════════════════════
   POPUP
═══════════════════════════════════════════════════════════════ */
function buildPopupHtml(peak) {
  const imgHtml = peak.photo
    ? `<img class="peak-popup-img" src="${peak.photo}" alt="${peak.name}" loading="lazy" />`
    : `<div class="peak-popup-img-placeholder"><div class="mountain-icon">⛰</div><div>Brak zdjęcia</div></div>`;
  return `
    <div class="peak-popup">
      ${imgHtml}
      <div class="peak-popup-body">
        <div class="peak-popup-rank">Korona Gór Polski · ${peak.rank}/28</div>
        <div class="peak-popup-name">${peak.name}</div>
        <div class="peak-popup-height">${peak.height.toLocaleString('pl-PL')} <span>m n.p.m.</span></div>
        <div class="peak-popup-meta">
          <div class="peak-popup-meta-row"><strong>Województwo</strong><span>${peak.province}</span></div>
          <div class="peak-popup-meta-row"><strong>Pasmo</strong><span>${peak.range}</span></div>
        </div>
        <div class="peak-popup-desc">${peak.desc}</div>
      </div>
    </div>`;
}

/* ═══════════════════════════════════════════════════════════════
   MAPA
═══════════════════════════════════════════════════════════════ */
const map = L.map('map', {
  center: [51.9, 19.1],
  zoom: 7,
  zoomControl: true,
  scrollWheelZoom: true,
});

function setTileLayer() {
  if (tileLayer) map.removeLayer(tileLayer);
  const url = isDark
    ? 'https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png'
    : 'https://{s}.basemaps.cartocdn.com/rastertiles/voyager/{z}/{x}/{y}{r}.png';
  tileLayer = L.tileLayer(url, {
    attribution: '© <a href="https://www.openstreetmap.org/">OpenStreetMap</a> © <a href="https://carto.com/">CARTO</a>',
    maxZoom: 18,
    subdomains: 'abcd',
  }).addTo(map);
}

/* Inicjalizacja mapy */
setTileLayer();

PEAKS.forEach(peak => {
  const marker = L.marker([peak.lat, peak.lng], { icon: createMarkerIcon() })
    .addTo(map)
    .bindPopup(buildPopupHtml(peak), { maxWidth: 320, minWidth: 280 });
  markers.push({ peak, marker });
});

/* ═══════════════════════════════════════════════════════════════
   MOTYW
═══════════════════════════════════════════════════════════════ */
document.getElementById('themeBtn').addEventListener('click', () => {
  isDark = !isDark;
  document.documentElement.setAttribute('data-theme', isDark ? 'dark' : 'light');
  document.getElementById('themeBtn').textContent = isDark ? '🌙' : '☀️';
  setTileLayer();
  refreshMarkerIcons();
});

/* ═══════════════════════════════════════════════════════════════
   AUTH MODAL
═══════════════════════════════════════════════════════════════ */
const authModal  = document.getElementById('authModal');
const loginBtn   = document.getElementById('loginBtn');
const modalClose = document.getElementById('modalClose');

loginBtn.addEventListener('click',   () => authModal.classList.add('open'));
modalClose.addEventListener('click', () => authModal.classList.remove('open'));
authModal.addEventListener('click',  e => { if (e.target === authModal) authModal.classList.remove('open'); });

document.getElementById('googleBtn').addEventListener('click', () => {
  showToast('⚙️ Skonfiguruj Google OAuth w Google Cloud Console');
});
document.getElementById('facebookBtn').addEventListener('click', () => {
  showToast('⚙️ Skonfiguruj Facebook OAuth w Meta for Developers');
});

function setLoggedIn(user) {
  const area = document.getElementById('authArea');
  const initials = user.name.split(' ').map(w => w[0]).join('').toUpperCase().slice(0, 2);
  area.innerHTML = `
    <div class="user-chip" id="userChip">
      <div class="user-avatar">${user.avatarUrl ? `<img src="${user.avatarUrl}" />` : initials}</div>
      <span class="user-name">${user.name.split(' ')[0]}</span>
    </div>`;
  document.getElementById('userChip').addEventListener('click', () => showToast('👤 Panel użytkownika — wkrótce!'));
}
</script>
